# ============================================================
# CI: freshness (tracked bundle + parameter tables), lint, smoke + variants
# ------------------------------------------------------------
# Runs on every push, pull request and published release, for the root
# project and the demo (examples/demo), on Ubuntu with pwsh (PowerShell 7) for
# the builds and bash for the checks -- the same scripts you run locally
# (docs/toolchain/platform-contract.md).
# OpenSCAD is the Nightly (development snapshot) from the official OBS apt repo,
# the recommended build: PMM renders with a recent snapshot + Manifold, which
# Ubuntu's own 2021.01 package lacks (docs/toolchain/setup.md). find_tools.sh
# picks `openscad-nightly` from PATH first.
# BOSL2 is checked out at the commit PMM uses so includes resolve and the
# lint's BOSL2 name-collision rule (P09) runs.
# Deterministic because MW_PLATE_SIZE is explicit in scripts/plates_config.sh
# (no Bambu Studio on the runner).
# ============================================================
name: check

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check:
    # Pinned: the nightly apt repo is per Ubuntu release.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [".", "examples/demo"]
    env:
      CI: "1"
      OPENSCADPATH: ${{ github.workspace }}/.ci/libraries
    steps:
      - uses: actions/checkout@v4

      - name: Skip examples when they were deleted
        id: exists
        run: |
          if [ -f "${{ matrix.project }}/scripts/project_config.sh" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install OpenSCAD Nightly
        if: steps.exists.outputs.run == 'true'
        run: |
          . /etc/os-release
          wget -qO- https://files.openscad.org/OBS-Repository-Key.pub | sudo tee /etc/apt/trusted.gpg.d/obs-openscad-nightly.asc > /dev/null
          echo "deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_${VERSION_ID}/ ./" | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
          sudo apt-get update
          sudo apt-get install -y openscad-nightly
          echo "OPENSCAD_BIN=$(command -v openscad-nightly)" >> "$GITHUB_ENV"
          openscad-nightly --version

      - name: Check out BOSL2 at the PMM commit
        if: steps.exists.outputs.run == 'true'
        run: |
          git clone --quiet https://github.com/BelfrySCAD/BOSL2.git "$OPENSCADPATH/BOSL2"
          git -C "$OPENSCADPATH/BOSL2" checkout --quiet 99fcfc6867e739aa1cd8ffc49fe39276036681f1

      # The MakerWorld build is NOT run here: it would rewrite the tracked
      # bundle and the generated parameter tables, hiding a stale commit.
      # check.sh's freshness stage builds into a temp file and compares
      # instead, so CI checks exactly what was committed.
      - name: Build the dev bundle
        if: steps.exists.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/build/dev_build.ps1 -Project "${{ matrix.project }}"

      - name: Freshness + lint + smoke (with SMOKE_VARIANTS)
        if: steps.exists.outputs.run == 'true'
        run: bash scripts/check/check.sh -p "${{ matrix.project }}"
